name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to publish, for example v1.0
        required: true
        default: v1.0
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build universal macOS app
    runs-on: macos-14
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Build app
        run: ./build.sh

      - name: Verify version and signature
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          plist_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/MouseToucher.app/Contents/Info.plist)

          if [[ "$tag_version" != "$plist_version" ]]; then
            echo "Tag version ($tag_version) does not match Info.plist ($plist_version)."
            exit 1
          fi

          codesign --verify --deep --strict build/MouseToucher.app
          file build/MouseToucher.app/Contents/MacOS/MouseToucher

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/MouseToucher-${RELEASE_TAG#v}.zip"
          ditto -c -k --sequesterRsrc --keepParent build/MouseToucher.app "$archive"
          shasum -a 256 "$archive" > "${archive}.sha256"
          unzip -t "$archive"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/MouseToucher-${RELEASE_TAG#v}.zip" \
            "dist/MouseToucher-${RELEASE_TAG#v}.zip.sha256" \
            --title "MouseToucher ${RELEASE_TAG#v}" \
            --generate-notes
